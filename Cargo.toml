[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
homepage = "https://autolang.dev"
repository = "https://github.com/AutoLang-Dev/autolang"
license = "Apache-2.0"

[workspace.dependencies]
cli.path = "crates/cli"
ide.path = "crates/ide"
lexer.path = "crates/lexer"
locale.path = "crates/locale"
lsp.path = "crates/lsp"
parser.path = "crates/parser"
syntax.path = "crates/syntax"

rgt = "0.1.1"

text-size = "1.1.1"
anyhow = "1.0.102"
line-index = "0.1.2"
lsp-server = "0.7.9"
lsp-types = "0.97.0"
serde_json = "1.0.149"
serde = "1.0.228"
serde_derive = "1.0.228"
sys-locale = "0.3.2"
unic-langid = { version = "0.9.6", features = ["macros"] }
unicode-ident = "1.0.24"
clap = { version = "4.6.1", features = ["string"] }

insta = "1.47.2"
