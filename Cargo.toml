[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
homepage = "https://autolang.dev"
repository = "https://github.com/AutoLang-Dev/autolang"
license = "Apache-2.0"

[workspace.dependencies]
cli.path = "crates/cli"
ide.path = "crates/ide"
lexer.path = "crates/lexer"
locale.path = "crates/locale"
lsp.path = "crates/lsp"
parser.path = "crates/parser"
syntax.path = "crates/syntax"

rgt = "0.1.1"
async-inc = "0.1.0"

text-size = "1.1.1"
anyhow = "1.0.102"
line-index = "0.1.2"
async-lsp = { version = "0.2.4", features = ["tokio"] }
serde_json = "1.0.149"
serde = "1.0.228"
serde_derive = "1.0.228"
sys-locale = "0.3.2"
unic-langid = { version = "0.9.6", features = ["macros"] }
unicode-ident = "1.0.24"
clap = { version = "4.6.1", features = ["string"] }
tokio = { version = "1.48.0", features = ["io-std", "macros", "rt"] }
tokio-util = { version = "0.7.17", features = ["compat"] }
tower = "0.4.13"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

insta = "1.47.2"
